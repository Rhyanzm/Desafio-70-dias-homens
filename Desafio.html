<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desafio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#0a0a0b;--card:#121214;--card2:#1a1a1e;--ink:#f4f4f5;--mut:#8a8a93;--line:#26262b;--acc:#c6ff3d}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:44px 16px 80px}
.badge{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
h1{font-size:clamp(34px,7vw,56px);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:18px 0 8px}
.sub{color:var(--mut);margin:0 0 20px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.pill{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:99px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.pill:before,.chip:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:12px;margin:0 0 20px}
.tabs button{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;font-size:14px;padding:9px 20px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#0a0a0b}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:12px}
.strip{display:flex;align-items:center;gap:8px}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:56px;height:62px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.day small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.day b{font-size:18px;font-weight:600}
.day.on{background:var(--ink);color:#0a0a0b;border-color:var(--ink)}.day.on small{color:#555}
.day.today:not(.on){border-color:var(--acc)}
.arrow{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mut);cursor:pointer;font-size:18px}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dayhead h2{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.dayhead p{margin:4px 0 0;color:var(--mut);font-size:14px}
.pct{text-align:right;font-size:38px;font-weight:700;color:var(--acc);letter-spacing:-.03em;line-height:1}
.pct small{display:block;font-size:10px;letter-spacing:.12em;color:var(--mut);font-weight:600;margin-top:6px}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.av{width:42px;height:42px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;font-weight:600}
.who{flex:1;min-width:120px}.who b{display:block;font-size:16px;font-weight:600}.who span{color:var(--mut);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip.on{background:var(--c);color:var(--tc);border-color:var(--c)}
.chip.on:before{content:"\2713";width:auto;height:auto;background:none;font-size:12px;border-radius:0}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:3px;width:100%;font-size:12px}
th{font-weight:600;color:var(--mut)}th,td{text-align:center;padding:1px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);padding-right:10px;font-size:14px;white-space:nowrap}
td i{display:block;width:16px;height:16px;border-radius:4px;margin:auto;background:var(--card2)}
td i.f{background:var(--acc)}td i.h{background:#4b5563}
td.p{font-weight:700;color:var(--acc);padding-left:6px}
.msg{text-align:center;color:var(--mut);padding:26px}
details summary{cursor:pointer;font-weight:600}
.adm{display:grid;gap:12px;margin-top:14px}
.adm input[type=text],.adm input[type=date],.adm input[type=number]{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);width:100%}
.adm label{display:grid;gap:6px;font-weight:600;font-size:13px;color:var(--mut)}
.adm h3{margin:6px 0 0;font-size:14px}
.add,.hrow{display:flex;gap:8px;align-items:center}
.hrow input[type=color]{width:44px;height:40px;padding:0;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer;flex:none}
.btn{border:0;background:var(--acc);color:#0a0a0b;font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;cursor:pointer;white-space:nowrap}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px;flex:none}
.x.ask{color:var(--acc);font-size:14px;font-weight:600}
.mem{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="badge" id="badge">Nosso desafio</span>
  <h1 id="title">Desafio de 31 dias</h1>
    <p class="sub" id="range">Um dia de cada vez, juntas.</p>
  <div class="pills" id="pills"></div>
  <div class="tabs"><button id="t1" class="on">Check do dia</button><button id="t2">Visão geral</button></div>
</header>
<main id="app"><div class="msg">Carregando…</div></main>
</div>
<script>
const DEF=[['Provérbio','#5eb0ff'],['Oração','#2563eb'],['Treino','#c7ccd1'],['Leitura','#6b7280']].map((x,i)=>({id:'h'+i,name:x[0],color:x[1]}));
const WD=['dom','seg','ter','qua','qui','sex','sáb'],MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
let db=null,user=null,canEdit=false,cfg={start:'',badge:'Nosso desafio',title:'Desafio de 31 dias',days:31,habits:DEF,members:[]},checks={},sel=1,tab=1,ready=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tc=c=>{const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);return .299*r+.587*g+.114*b>150?'#0a0a0b':'#fff'};
const D=()=>cfg.days;let pend=null,pt=0;function ask(id){pend=id;clearTimeout(pt);pt=setTimeout(()=>{pend=null;render()},4000);render()}
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#0a0a0b;padding:12px 18px;border-radius:99px;z-index:9;font-weight:700;max-width:90%';document.body.appendChild(e)}e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4000)}
function dateOf(n){const [y,m,d]=cfg.start.split('-').map(Number);return new Date(y,m-1,d+n-1)}
function todayN(){if(!cfg.start)return 1;const [y,m,d]=cfg.start.split('-').map(Number);const t=new Date();return Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate())-new Date(y,m-1,d))/864e5)+1}
function norm(o){const r={};for(const k in o){let v=o[k];if(Array.isArray(v)&&v.length===4&&v.every(x=>x===0||x===1))v=v.map((x,i)=>x?'h'+i:null).filter(Boolean);r[k]=v}return r}
const ids=()=>cfg.habits.map(h=>h.id);
function done(id,n){const a=(checks[id]&&checks[id][n])||[];return a.filter(x=>ids().includes(x))}
function dayPct(n){const M=cfg.members.length,H=cfg.habits.length;if(!M||!H)return 0;let s=0;cfg.members.forEach(m=>s+=done(m.id,n).length);return Math.round(s/(M*H)*100)}
async function toggle(id,n,hid){
  if(!db)return;
  const cur=checks[id]||{};let arr=[...((cur[n])||[])];arr=arr.includes(hid)?arr.filter(x=>x!==hid):[...arr,hid];
  checks[id]={...cur,[n]:arr};render();
  try{await db.doc('checks/'+id).set({d:JSON.stringify(checks[id])})}catch(e){toast('Não foi possível salvar. Você precisa estar logada e com permissão para editar.')}
}
async function saveCfg(){
  if(document.activeElement)document.activeElement.blur();render();
  try{await db.doc('config/main').set({start:cfg.start,badge:cfg.badge,title:cfg.title,days:cfg.days,habits:JSON.stringify(cfg.habits),members:JSON.stringify(cfg.members)})}catch(e){toast('Não foi possível salvar a configuração.')}
}
function head(){
  $('#badge').textContent=cfg.badge;$('#title').textContent=cfg.title;
  $('#pills').innerHTML=cfg.habits.map(h=>'<span class="pill" style="--c:'+h.color+'">'+esc(h.name)+'</span>').join('');
  if(cfg.start){const s=dateOf(1),e=dateOf(D());$('#range').textContent='De '+s.getDate()+' de '+MO[s.getMonth()]+' a '+e.getDate()+' de '+MO[e.getMonth()]+'. Um dia de cada vez, juntas.'}
}
function render(){
  if(!ready)return;
  const a=document.activeElement;if(a&&a.tagName==='INPUT'&&a.closest('#adm'))return;
  head();const app=$('#app');
  if(!db){app.innerHTML='<div class="card msg">Entre com sua conta do Claude para ver e marcar o desafio.</div>';return}
  if(!cfg.start||!cfg.members.length||!cfg.habits.length){
    app.innerHTML='<div class="card msg">'+(canEdit?'Configure a data de início, os checks e as participantes abaixo para começar.':'A líder ainda está configurando o desafio. Volte em breve!')+'</div>'+admin();bind();return}
  let h='';const days=D(),H=cfg.habits.length;
  if(tab===1){
    const tn=todayN();
    h+='<div class="card strip"><button class="arrow" data-s="-1">‹</button><div class="days" id="days">';
    for(let n=1;n<=days;n++){const d=dateOf(n);h+='<button class="day'+(n===sel?' on':'')+(n===tn?' today':'')+'" data-n="'+n+'"><small>'+WD[d.getDay()]+'</small><b>'+d.getDate()+'</b></button>'}
    h+='</div><button class="arrow" data-s="1">›</button></div>';
    const d=dateOf(sel);
    h+='<div class="card dayhead"><div><h2>Dia '+sel+' · '+d.getDate()+' de '+MO[d.getMonth()]+'</h2><p>Marque o que você fez hoje!</p></div><div class="pct">'+dayPct(sel)+'%<small>DO GRUPO</small></div></div>';
    cfg.members.forEach(m=>{const c=done(m.id,sel);
      h+='<div class="card row"><div class="av">'+esc(m.name[0]||'?').toUpperCase()+'</div><div class="who"><b>'+esc(m.name)+'</b><span>'+c.length+'/'+H+' concluídos</span></div><div class="chips">'+cfg.habits.map(x=>'<button class="chip'+(c.includes(x.id)?' on':'')+'" style="--c:'+x.color+';--tc:'+tc(x.color)+'" data-m="'+m.id+'" data-h="'+x.id+'">'+esc(x.name)+'</button>').join('')+'</div></div>'})
  }else{
    h+='<div class="card scroll"><table><tr><th></th>';
    for(let n=1;n<=days;n++)h+='<th>'+dateOf(n).getDate()+'</th>';
    h+='<th>%</th></tr>';
    cfg.members.forEach(m=>{let tot=0;h+='<tr><td>'+esc(m.name)+'</td>';
      for(let n=1;n<=days;n++){const k=done(m.id,n).length;tot+=k;h+='<td><i class="'+(k===H?'f':k>0?'h':'')+'"></i></td>'}
      h+='<td class="p">'+Math.round(tot/(days*H)*100)+'%</td></tr>'});
    let g=0;for(let n=1;n<=days;n++)g+=dayPct(n);
    h+='</table></div><div class="card dayhead"><div><h2>Grupo</h2><p>Média dos '+days+' dias</p></div><div class="pct">'+Math.round(g/days)+'%<small>CONCLUÍDO</small></div></div>';
  }
  app.innerHTML=h+admin();bind();
  const on=document.querySelector('.day.on');if(on&&tab===1&&!render.done){on.scrollIntoView({inline:'center',block:'nearest'});render.done=1}
}
function admin(){
  if(!canEdit)return '';
  return '<div class="card" id="adm"><details'+(!cfg.start?' open':'')+'><summary>⚙️ Configurar desafio</summary><div class="adm">'
  +'<label>Título grande<input type="text" id="ttl" maxlength="50" value="'+esc(cfg.title)+'"></label>'
  +'<label>Etiqueta do topo<input type="text" id="bdg" maxlength="40" value="'+esc(cfg.badge)+'"></label>'
  +'<label>Data de início (dia 1)<input type="date" id="start" value="'+cfg.start+'"></label>'
  +'<label>Duração (dias)<input type="number" id="dias" min="1" max="90" value="'+cfg.days+'"></label>'
  +'<h3>Checks (nome e cor)</h3>'+cfg.habits.map(x=>'<div class="hrow"><input type="color" data-hc="'+x.id+'" value="'+x.color+'"><input type="text" data-hn="'+x.id+'" maxlength="24" value="'+esc(x.name)+'"><button class="x'+(pend===x.id?' ask':'')+'" data-hd="'+x.id+'" title="Remover">'+(pend===x.id?'Remover?':'✕')+'</button></div>').join('')
  +'<div><button class="btn" id="addh">+ Novo check</button></div>'
  +'<h3>Participantes</h3><div class="add"><input type="text" id="nm" placeholder="Nome da participante"><button class="btn" id="add">Adicionar</button></div>'
  +cfg.members.map(m=>'<div class="mem"><span>'+esc(m.name)+'</span><button class="x'+(pend===m.id?' ask':'')+'" data-del="'+m.id+'" title="Remover">'+(pend===m.id?'Remover?':'✕')+'</button></div>').join('')
  +'</div></details></div>';
}
const PAL=['#5eb0ff','#2563eb','#c7ccd1','#6b7280','#39ff14','#94a3b8','#38bdf8','#1e3a8a'];
function bind(){
  document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{sel=+b.dataset.n;render()});
  document.querySelectorAll('.arrow').forEach(b=>b.onclick=()=>{const el=$('#days');if(el)el.scrollBy({left:b.dataset.s*300,behavior:'smooth'})});
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>toggle(b.dataset.m,sel,b.dataset.h));
  const on=(id,f)=>{const e=$(id);if(e)e.onchange=()=>f(e)};
  on('#ttl',e=>{cfg.title=e.value.trim()||'Desafio';saveCfg()});
  on('#bdg',e=>{cfg.badge=e.value.trim()||'Nosso desafio';saveCfg()});
  on('#start',e=>{cfg.start=e.value;saveCfg()});
  on('#dias',e=>{cfg.days=Math.min(90,Math.max(1,parseInt(e.value)||31));if(sel>cfg.days)sel=cfg.days;saveCfg()});
  document.querySelectorAll('[data-hc]').forEach(e=>e.onchange=()=>{cfg.habits.find(x=>x.id===e.dataset.hc).color=e.value;saveCfg()});
  document.querySelectorAll('[data-hn]').forEach(e=>e.onchange=()=>{cfg.habits.find(x=>x.id===e.dataset.hn).name=e.value.trim()||'Check';saveCfg()});
  document.querySelectorAll('[data-hd]').forEach(b=>b.onclick=()=>{if(pend===b.dataset.hd){pend=null;cfg.habits=cfg.habits.filter(x=>x.id!==b.dataset.hd);saveCfg()}else ask(b.dataset.hd)});
  const ah=$('#addh');if(ah)ah.onclick=()=>{cfg.habits.push({id:'h'+Date.now().toString(36),name:'Novo check',color:PAL[cfg.habits.length%PAL.length]});saveCfg()};
  const ad=$('#add');if(ad)ad.onclick=()=>{const v=$('#nm').value.trim();if(!v)return;cfg.members.push({id:'m'+Date.now().toString(36),name:v});saveCfg()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(pend===b.dataset.del){pend=null;cfg.members=cfg.members.filter(m=>m.id!==b.dataset.del);saveCfg()}else ask(b.dataset.del)});
}
$('#t1').onclick=()=>{tab=1;$('#t1').className='on';$('#t2').className='';render()};
$('#t2').onclick=()=>{tab=2;$('#t2').className='on';$('#t1').className='';render()};
(async()=>{
  try{user=await claude.use('user');canEdit=user?user.canEdit():false;db=await claude.use('db')}catch(e){db=null}
  ready=true;
  if(!db){render();return}
  db.doc('config/main').onSnapshot(s=>{const d=s.exists?s.data():null;
    if(d){cfg.start=d.start||'';cfg.badge=d.badge||'Nosso desafio';cfg.title=d.title||'Desafio de 31 dias';cfg.days=d.days||31;
      try{const hb=JSON.parse(d.habits||'null');cfg.habits=Array.isArray(hb)?hb:DEF}catch(e){cfg.habits=DEF}
      try{cfg.members=JSON.parse(d.members||'[]')}catch(e){cfg.members=[]}}
    if(!render.init&&cfg.start){sel=Math.min(D(),Math.max(1,todayN()));render.init=1}
    render()});
  db.collection('checks').onSnapshot(q=>{q.docs.forEach(x=>{try{checks[x.id]=norm(JSON.parse(x.data().d||'{}'))}catch(e){}});render()});
})();
</script>
</body>
</html>
